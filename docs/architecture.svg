<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606A"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CF222E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="700" fill="#FFFFFF"/>

  <rect x="60" y="24" width="360" height="68" rx="10" fill="#DBE9FF" stroke="#0969DA" stroke-width="1.5"/>
  <text x="240" y="53" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2328">平台数据源 · DataSource Adapter</text>
  <text x="240" y="76" text-anchor="middle" font-size="13" fill="#57606A">fetch() → 归一化 items / stores</text>

  <rect x="520" y="24" width="340" height="68" rx="10" fill="#FFFFFF" stroke="#8C959F" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="690" y="52" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1F2328">ExampleAdapter：内置虚构示例</text>
  <text x="690" y="75" text-anchor="middle" font-size="12.5" fill="#57606A">你的真实适配器 → 保留在私有环境</text>
  <line x1="520" y1="58" x2="428" y2="58" stroke="#8C959F" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <line x1="240" y1="92" x2="240" y2="112" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="128" y="118" width="224" height="34" rx="17" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
  <text x="240" y="140" text-anchor="middle" font-size="13" fill="#1F2328">归一化 {gid, name, price…}</text>

  <line x1="240" y1="152" x2="240" y2="172" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="60" y="178" width="360" height="68" rx="10" fill="#FFF8C5" stroke="#D4A72C" stroke-width="1.5"/>
  <text x="240" y="207" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1F2328">完整性校验 · validation</text>
  <text x="240" y="229" text-anchor="middle" font-size="12.5" fill="#57606A">最小记录数 ｜ 分页失败 ｜ 详情失败比例</text>

  <line x1="420" y1="212" x2="512" y2="212" stroke="#CF222E" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <text x="466" y="200" text-anchor="middle" font-size="11.5" fill="#CF222E">未通过</text>
  <rect x="520" y="172" width="340" height="80" rx="10" fill="#FFEBE9" stroke="#CF222E" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="690" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#CF222E">校验未通过 → 告警 + exit 1</text>
  <text x="690" y="228" text-anchor="middle" font-size="12.5" fill="#57606A">不写快照 · 不比对 · 不同步（fail-safe）</text>

  <line x1="240" y1="246" x2="240" y2="266" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="60" y="272" width="360" height="68" rx="10" fill="#DDFBE7" stroke="#1A7F37" stroke-width="1.5"/>
  <text x="240" y="301" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1F2328">原子快照 · snapshot</text>
  <text x="240" y="323" text-anchor="middle" font-size="12.5" fill="#57606A">tmp + os.replace → snapshot_日期.json</text>

  <line x1="240" y1="340" x2="240" y2="360" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="60" y="366" width="360" height="104" rx="10" fill="#FBEFFF" stroke="#8250DF" stroke-width="1.5"/>
  <text x="240" y="398" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1F2328">变化检测 · diff（纯函数）</text>
  <rect x="123" y="412" width="44" height="22" rx="11" fill="#FFFFFF" stroke="#8250DF" stroke-width="1"/>
  <text x="145" y="427" text-anchor="middle" font-size="11" fill="#8250DF">new</text>
  <rect x="175" y="412" width="70" height="22" rx="11" fill="#FFFFFF" stroke="#8250DF" stroke-width="1"/>
  <text x="210" y="427" text-anchor="middle" font-size="11" fill="#8250DF">removed</text>
  <rect x="253" y="412" width="104" height="22" rx="11" fill="#FFFFFF" stroke="#8250DF" stroke-width="1"/>
  <text x="305" y="427" text-anchor="middle" font-size="11" fill="#8250DF">price_changed</text>
  <rect x="129" y="440" width="104" height="22" rx="11" fill="#FFFFFF" stroke="#8250DF" stroke-width="1"/>
  <text x="181" y="455" text-anchor="middle" font-size="11" fill="#8250DF">name_changed</text>
  <rect x="241" y="440" width="110" height="22" rx="11" fill="#FFFFFF" stroke="#8250DF" stroke-width="1"/>
  <text x="296" y="455" text-anchor="middle" font-size="11" fill="#8250DF">stores_changed</text>

  <line x1="240" y1="470" x2="240" y2="494" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="60" y="500" width="360" height="96" rx="10" fill="#DBE9FF" stroke="#0969DA" stroke-width="1.5"/>
  <text x="240" y="530" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1F2328">通知与同步</text>
  <text x="240" y="554" text-anchor="middle" font-size="12.5" fill="#1F2328">钉钉多维表：表A 全量 ｜ 表B 变化</text>
  <text x="240" y="576" text-anchor="middle" font-size="12.5" fill="#57606A">Webhook 告警 ｜ 历史查询（同步失败 → exit 1）</text>

  <line x1="240" y1="596" x2="240" y2="618" stroke="#57606A" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="60" y="624" width="800" height="46" rx="10" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2"/>
  <text x="460" y="652" text-anchor="middle" font-size="13.5" fill="#1F2328">默认 dry-run（零外部写入）　·　写入需 --enable-write 双重闸门　·　同步语义 at-least-once　·　快照/状态原子写入</text>
</svg>
