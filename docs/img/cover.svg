<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#e9eff9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245bdb"/>
      <stop offset="1" stop-color="#4a7ce8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#245bdb" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#245bdb" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g fill="#245bdb" opacity="0.05">
    <circle cx="60" cy="330" r="90"/>
    <circle cx="1180" cy="40" r="70"/>
  </g>
  <rect y="300" width="1200" height="100" fill="url(#glow)"/>

  <!-- Logo -->
  <rect x="64" y="64" width="76" height="76" rx="18" fill="url(#brand)"/>
  <g transform="translate(64,64)">
    <path d="M60 38 H47 L40 61 L30 15 L23 38 H16" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 标题区 -->
  <text x="64" y="196" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#0f172a">GooseWatch · 看家大鹅</text>
  <text x="64" y="240" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="26" font-weight="700" fill="#245bdb">商品一变，立刻知道</text>
  <text x="64" y="272" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="17" fill="#475569">价格 · 名称 · 门店 · 库存 —— 看家大鹅，有变化就叫</text>

  <!-- 特性胶囊 -->
  <g font-family="-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="14" font-weight="600">
    <rect x="64"  y="298" width="96" height="34" rx="17" fill="#e8effc" stroke="#c9dbf7"/>
    <text x="112" y="320" text-anchor="middle" fill="#245bdb">快照比对</text>
    <rect x="172" y="298" width="96" height="34" rx="17" fill="#e8effc" stroke="#c9dbf7"/>
    <text x="220" y="320" text-anchor="middle" fill="#245bdb">内容幂等</text>
    <rect x="280" y="298" width="96" height="34" rx="17" fill="#e8effc" stroke="#c9dbf7"/>
    <text x="328" y="320" text-anchor="middle" fill="#245bdb">崩溃自愈</text>
    <rect x="388" y="298" width="120" height="34" rx="17" fill="#e9f7ee" stroke="#bfe3cc"/>
    <text x="448" y="320" text-anchor="middle" fill="#1f7a3d">默认 dry-run</text>
  </g>

  <text x="64" y="368" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="13" fill="#64748b">Apache-2.0 · Python 3.9+ · 本页数据全部虚构 · 钉钉同步可选</text>

  <!-- 控制台卡片（真实引擎输出） -->
  <g filter="url(#cardShadow)">
    <rect x="660" y="58" width="476" height="284" rx="14" fill="#0d1117"/>
  </g>
  <circle cx="686" cy="84" r="6" fill="#ff5f57"/>
  <circle cx="706" cy="84" r="6" fill="#febc2e"/>
  <circle cx="726" cy="84" r="6" fill="#28c840"/>
  <text x="898" y="89" text-anchor="middle" font-family="Menlo,Consolas,monospace" font-size="12" fill="#8b949e">run_demo.py · 真实引擎</text>
  <line x1="660" y1="102" x2="1136" y2="102" stroke="#21262d"/>

  <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14">
    <text x="682" y="132" fill="#79c0ff">$ python run_demo.py</text>

    <text x="682" y="164" fill="#c9d1d9">对比 2026-10-05：变化 <tspan fill="#ffa657" font-weight="bold">208</tspan> 条</text>
    <text x="682" y="188" fill="#8b949e">  {'price_changed': 60, 'unit_price_changed': 60,</text>
    <text x="682" y="210" fill="#8b949e">   'stores_changed': 59, 'count_changed': 29}</text>

    <text x="682" y="244" fill="#8b949e"># 同 seed 复跑一天（数据源没变）</text>
    <text x="682" y="276" fill="#c9d1d9">对比 2026-10-06：变化 <tspan fill="#7ee787" font-weight="bold">0</tspan> 条 {}</text>
    <text x="682" y="312" fill="#7ee787" font-style="italic">  ← 引擎不制造假新闻</text>
  </g>
</svg>
